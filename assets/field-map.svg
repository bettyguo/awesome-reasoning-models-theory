<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The reasoning model field map: eight chapters and their interconnections">
  <defs>
    <linearGradient id="fm-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="fm-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-debate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#fm-bg)"/>
  <rect width="1200" height="760" fill="url(#fm-grid)"/>

  <!-- Title -->
  <g font-family="'Inter', system-ui, sans-serif">
    <text x="60" y="56" font-size="13" letter-spacing="4" font-weight="500" fill="#7dd3fc">FIELD MAP</text>
    <text x="60" y="100" font-size="32" font-weight="800" fill="#f8fafc">The eight chapters and how they hang together</text>
    <text x="60" y="128" font-size="14" font-weight="400" fill="#94a3b8">Solid arrows: mechanism dependency. Dashed arrows: open debate.</text>
  </g>

  <!--
    Clean grid layout (all coordinates absolute, no transforms).
    Row 1 (y=180): CH1 (left, 60..340)  ·  CH8 (right, 860..1140)
    Row 2 (y=330): CH2 (left)  ·  CH3 (mid, 460..740)  ·  CH4 (right)
    Row 3 (y=480): CH5 (left)  ·  CH6 (mid)            ·  CH7 (right)
    Box dimensions: 280 wide, 90 tall.
  -->

  <!-- ROW 1 -->
  <!-- CH1 — foundation -->
  <g>
    <rect x="60" y="180" width="280" height="90" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="80" y="208" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">CH 1 · FOUNDATION</text>
    <text x="80" y="234" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">CoT &amp; Scratchpads</text>
    <text x="80" y="256" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Why intermediate tokens matter</text>
  </g>

  <!-- CH8 — synthesis -->
  <g>
    <rect x="860" y="180" width="280" height="90" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="880" y="208" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#c4b5fd">CH 8 · SYNTHESIS</text>
    <text x="880" y="234" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Theoretical Frameworks</text>
    <text x="880" y="256" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Unifying the three accounts</text>
  </g>

  <!-- ROW 2 -->
  <!-- CH2 — inference -->
  <g>
    <rect x="60" y="330" width="280" height="90" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="80" y="358" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6ee7b7">CH 2 · INFERENCE</text>
    <text x="80" y="384" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Test-Time Compute</text>
    <text x="80" y="406" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Scaling inference instead of params</text>
  </g>

  <!-- CH3 — inference -->
  <g>
    <rect x="460" y="330" width="280" height="90" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="480" y="358" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6ee7b7">CH 3 · INFERENCE</text>
    <text x="480" y="384" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Sampling &amp; Verification</text>
    <text x="480" y="406" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">BoN, self-consistency, PRMs</text>
  </g>

  <!-- CH4 — inference -->
  <g>
    <rect x="860" y="330" width="280" height="90" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="880" y="358" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6ee7b7">CH 4 · INFERENCE</text>
    <text x="880" y="384" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Search at Inference</text>
    <text x="880" y="406" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">ToT, GoT, recursive aggregation</text>
  </g>

  <!-- ROW 3 -->
  <!-- CH5 — training -->
  <g>
    <rect x="60" y="480" width="280" height="90" rx="10" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="80" y="508" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fdba74">CH 5 · TRAINING</text>
    <text x="80" y="534" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">RL for Reasoning</text>
    <text x="80" y="556" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">R1-Zero, GRPO, RLVR</text>
  </g>

  <!-- CH6 — failure modes -->
  <g>
    <rect x="460" y="480" width="280" height="90" rx="10" fill="#0b1220" stroke="#f472b6" stroke-width="1.5"/>
    <text x="480" y="508" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fbcfe8">CH 6 · FAILURE</text>
    <text x="480" y="534" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Overthinking &amp; Length</text>
    <text x="480" y="556" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">When more CoT hurts</text>
  </g>

  <!-- CH7 — failure modes -->
  <g>
    <rect x="860" y="480" width="280" height="90" rx="10" fill="#0b1220" stroke="#f472b6" stroke-width="1.5"/>
    <text x="880" y="508" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#fbcfe8">CH 7 · FAILURE</text>
    <text x="880" y="534" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Faithfulness of Traces</text>
    <text x="880" y="556" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">CoT ≠ computation</text>
  </g>

  <!-- ============== ARROWS (drawn after boxes for clarity) ============== -->

  <!-- Solid mechanism dependencies -->

  <!-- CH1 → CH2 (CoT enables test-time compute) - vertical down from CH1 bottom-center -->
  <line x1="200" y1="270" x2="200" y2="330" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH1 → CH8 (CoT mechanism feeds theoretical frameworks) - horizontal right -->
  <line x1="340" y1="225" x2="860" y2="225" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH2 → CH3 (TTC scaling motivates verification) - horizontal right -->
  <line x1="340" y1="375" x2="460" y2="375" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH3 → CH4 (verification → search) - horizontal right -->
  <line x1="740" y1="375" x2="860" y2="375" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH2 → CH5 (TTC informs training trade-offs) - vertical down -->
  <line x1="140" y1="420" x2="140" y2="480" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH5 → CH6 (RL training causes overthinking) - horizontal right -->
  <line x1="340" y1="525" x2="460" y2="525" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH6 → CH7 (length pathology relates to faithfulness) - horizontal right -->
  <line x1="740" y1="525" x2="860" y2="525" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH4 → CH8 (search-at-inference theory feeds frameworks) - vertical up in right column -->
  <line x1="1000" y1="330" x2="1000" y2="270" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- CH7 → CH8 (faithfulness theory feeds frameworks) - L-routed around the right edge at x=1170 -->
  <polyline points="1140,505 1170,505 1170,250 1140,250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Dashed open debates — orthogonal routes through the inter-row gaps so they never cross any box -->

  <!-- CH4 ↔ CH5 (search-vs-RL debate)
       Z-route through row-2/3 gap (y=450): CH4 bottom (1000,420) ↓ to gap, ← across gap, ↓ into CH5 top -->
  <polyline points="1000,420 1000,450 200,450 200,480"
            fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 5" stroke-opacity="0.75"/>

  <!-- CH1 ↔ CH7 (CoT-as-thought vs unfaithful debate)
       Right-perimeter route at x=1210 (outside col-3) through both inter-row gaps:
       CH1 bottom (300,270) ↓ to row-1/2 gap, → far right, ↓ down the right margin, ← into CH7 top -->
  <polyline points="300,270 300,300 1210,300 1210,540 1140,540"
            fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 5" stroke-opacity="0.75"/>

  <!-- ============== LEGEND ============== -->
  <g transform="translate(60, 660)" font-family="'Inter', system-ui, sans-serif">
    <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="2" fill="#94a3b8">LEGEND</text>

    <g transform="translate(0, 22)">
      <line x1="0" y1="6" x2="44" y2="6" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
      <text x="56" y="10" font-size="12" fill="#cbd5e1">mechanism dependency</text>
    </g>
    <g transform="translate(240, 22)">
      <line x1="0" y1="6" x2="44" y2="6" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6 5"/>
      <text x="56" y="10" font-size="12" fill="#cbd5e1">open debate</text>
    </g>

    <g transform="translate(0, 56)">
      <rect width="14" height="14" rx="2" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="22" y="11" font-size="12" fill="#cbd5e1">foundation</text>
    </g>
    <g transform="translate(120, 56)">
      <rect width="14" height="14" rx="2" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
      <text x="22" y="11" font-size="12" fill="#cbd5e1">inference-time</text>
    </g>
    <g transform="translate(260, 56)">
      <rect width="14" height="14" rx="2" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
      <text x="22" y="11" font-size="12" fill="#cbd5e1">training-time</text>
    </g>
    <g transform="translate(400, 56)">
      <rect width="14" height="14" rx="2" fill="#0b1220" stroke="#f472b6" stroke-width="1.5"/>
      <text x="22" y="11" font-size="12" fill="#cbd5e1">failure modes</text>
    </g>
    <g transform="translate(540, 56)">
      <rect width="14" height="14" rx="2" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="22" y="11" font-size="12" fill="#cbd5e1">synthesis</text>
    </g>
  </g>
</svg>
