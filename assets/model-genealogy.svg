<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="Reasoning model family tree: lineage of major closed and open reasoning models in 2024-2026">
  <defs>
    <linearGradient id="mg-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="mg-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="mg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#mg-bg)"/>
  <rect width="1280" height="820" fill="url(#mg-grid)"/>

  <!-- Title -->
  <g font-family="'Inter', system-ui, sans-serif">
    <text x="60" y="56" font-size="13" letter-spacing="4" font-weight="500" fill="#7dd3fc">FAMILY TREE</text>
    <text x="60" y="100" font-size="32" font-weight="800" fill="#f8fafc">Reasoning models, 2024–2026</text>
    <text x="60" y="128" font-size="14" fill="#94a3b8">From base → SFT → RL stages, with closed (orange) and open (green) tracks shown side by side.</text>
  </g>

  <!-- Column headers (4 stages) -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc" text-anchor="middle">
    <text x="160" y="180">BASE PRETRAIN</text>
    <text x="450" y="180">+ SFT (COLD START)</text>
    <text x="780" y="180">+ RLVR / RLHF</text>
    <text x="1110" y="180">DEPLOYED REASONER</text>
  </g>
  <line x1="60" y1="195" x2="1220" y2="195" stroke="#1e293b" stroke-width="1"/>

  <!-- ============================================
       OPEN TRACK (top half) — green border
       ============================================ -->

  <!-- DeepSeek-V3 base → R1-Zero → R1 -->
  <g>
    <rect x="60" y="220" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">DeepSeek-V3</text>
    <text x="160" y="265" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">671B MoE base · 2024-12</text>
  </g>
  <line x1="260" y1="250" x2="350" y2="250" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="305" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#94a3b8">no SFT</text>

  <g>
    <rect x="660" y="220" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">DeepSeek-R1-Zero</text>
    <text x="780" y="265" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">pure GRPO · 2025-01</text>
  </g>
  <line x1="350" y1="250" x2="660" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <text x="500" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">RLVR-only (rule-based reward)</text>

  <line x1="900" y1="250" x2="980" y2="250" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="220" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="1100" y="245" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">DeepSeek-R1</text>
    <text x="1100" y="265" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">+ SFT for readability · 2025-01</text>
  </g>

  <!-- Qwen2.5 base → QwQ → Qwen3 reasoning -->
  <g>
    <rect x="60" y="310" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Qwen2.5-32B</text>
    <text x="160" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">dense base · 2024-09</text>
  </g>
  <line x1="260" y1="340" x2="350" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="350" y="310" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Qwen2.5 + reasoning SFT</text>
    <text x="450" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">long-CoT seed</text>
  </g>
  <line x1="550" y1="340" x2="660" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="660" y="310" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">QwQ-32B-Preview</text>
    <text x="780" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">SFT + RL · 2024-11</text>
  </g>
  <line x1="900" y1="340" x2="980" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="310" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="1100" y="335" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Qwen3-Reasoning</text>
    <text x="1100" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">MoE · 2025-04</text>
  </g>

  <!-- Distillation lineage: R1 → R1-Distill (dashed downward arrow into Qwen2.5) -->
  <path d="M 1100 280 L 1100 392 L 200 392 L 200 370" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <text x="650" y="386" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#c4b5fd">R1-Distill chains seed Qwen/Llama students →</text>

  <!-- Llama-3.1 base → s1 → Tulu-3 -->
  <g>
    <rect x="60" y="420" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Qwen2.5-32B-Instruct</text>
    <text x="160" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">dense · 2024-09</text>
  </g>
  <line x1="260" y1="450" x2="350" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="350" y="420" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">s1: SFT on 1k traces</text>
    <text x="450" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">no RL</text>
  </g>
  <line x1="550" y1="450" x2="660" y2="450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <g>
    <rect x="660" y="420" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">+ budget forcing at inference</text>
    <text x="780" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">no training-time RL</text>
  </g>
  <line x1="900" y1="450" x2="980" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="420" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="1100" y="445" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">s1-32B</text>
    <text x="1100" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">2025-01</text>
  </g>

  <!-- Llama 3.1 405B → Tulu-3 -->
  <g>
    <rect x="60" y="510" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Llama-3.1-405B</text>
    <text x="160" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">dense base · 2024-07</text>
  </g>
  <line x1="260" y1="540" x2="350" y2="540" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="350" y="510" width="200" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Tülu 3 SFT</text>
    <text x="450" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">curated data</text>
  </g>
  <line x1="550" y1="540" x2="660" y2="540" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="660" y="510" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="780" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">+ DPO + RLVR</text>
    <text x="780" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">first named "RLVR"</text>
  </g>
  <line x1="900" y1="540" x2="980" y2="540" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="510" width="240" height="60" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <text x="1100" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Tülu 3 405B</text>
    <text x="1100" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">2024-11</text>
  </g>

  <!-- divider band -->
  <line x1="60" y1="600" x2="1220" y2="600" stroke="#334155" stroke-width="1" stroke-dasharray="3 6"/>
  <text x="60" y="618" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#fdba74">CLOSED MODELS · UNDISCLOSED LINEAGE</text>

  <!-- ============================================
       CLOSED TRACK (bottom) — orange border
       ============================================ -->

  <g>
    <rect x="60" y="640" width="200" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="160" y="665" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GPT-4 / GPT-4o</text>
    <text x="160" y="685" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">undisclosed base</text>
  </g>
  <line x1="260" y1="670" x2="350" y2="670" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="350" y="640" width="200" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="450" y="665" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">undisclosed SFT</text>
    <text x="450" y="685" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">vendor: "RL on reasoning"</text>
  </g>
  <line x1="550" y1="670" x2="660" y2="670" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="660" y="640" width="240" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="780" y="665" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">RL stack (judge + verifier)</text>
    <text x="780" y="685" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">undisclosed details</text>
  </g>
  <line x1="900" y1="670" x2="980" y2="670" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="640" width="240" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="1100" y="657" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">o1 → o3-mini → o3</text>
    <text x="1100" y="677" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">2024-09 · 2025-01 · 2025-04</text>
    <text x="1100" y="693" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#fdba74">trace hidden by policy</text>
  </g>

  <g>
    <rect x="60" y="720" width="200" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="160" y="745" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Claude 3.5 / 3.7 base</text>
    <text x="160" y="765" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">undisclosed</text>
  </g>
  <line x1="260" y1="750" x2="660" y2="750" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <text x="460" y="740" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-style="italic" fill="#94a3b8">vendor describes RLVR + judge stack</text>
  <g>
    <rect x="660" y="720" width="240" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="780" y="745" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">extended-thinking RL</text>
    <text x="780" y="765" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">configurable token budget</text>
  </g>
  <line x1="900" y1="750" x2="980" y2="750" stroke="#64748b" stroke-width="1.5" marker-end="url(#mg-arrow)"/>
  <g>
    <rect x="980" y="720" width="240" height="60" rx="8" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/>
    <text x="1100" y="745" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Claude 3.7 (ext think)</text>
    <text x="1100" y="765" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">2025-02</text>
  </g>

  <!-- Legend (top-right) -->
  <g transform="translate(940, 60)">
    <rect width="280" height="78" rx="8" fill="rgba(11,18,32,0.7)" stroke="#1e293b"/>
    <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#94a3b8">LEGEND</text>
    <rect x="14" y="32" width="14" height="10" rx="2" fill="#0b1220" stroke="#34d399"/>
    <text x="34" y="41" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">open weights / disclosed recipe</text>
    <rect x="14" y="50" width="14" height="10" rx="2" fill="#0b1220" stroke="#fb923c"/>
    <text x="34" y="59" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">closed weights / partial disclosure</text>
    <line x1="14" y1="68" x2="34" y2="68" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="40" y="71" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">distillation lineage</text>
  </g>
</svg>
