<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Closed vs open reasoning model gap, by benchmark, 2024-2026">
  <defs>
    <linearGradient id="cobg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="cogrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1100" height="560" fill="url(#cobg)"/>
  <rect width="1100" height="560" fill="url(#cogrid)"/>

  <g font-family="'Inter', system-ui, sans-serif">
    <text x="60" y="56" font-size="13" letter-spacing="4" font-weight="500" fill="#7dd3fc">CLOSED-vs-OPEN GAP</text>
    <text x="60" y="100" font-size="28" font-weight="800" fill="#f8fafc">The frontier closed → reproduced open in &lt; 4 months</text>
    <text x="60" y="124" font-size="13" fill="#94a3b8">Stylized timeline. Each dot = first credible report. Open-weights (●green) catches up to closed (●pink) on each axis.</text>
  </g>

  <!-- Axes -->
  <g transform="translate(80, 180)">
    <line x1="0" y1="280" x2="980" y2="280" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="280" stroke="#475569" stroke-width="1.5"/>

    <!-- Y axis labels (benchmarks) -->
    <g font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">
      <text x="-10" y="40" text-anchor="end">AIME 2024</text>
      <text x="-10" y="100" text-anchor="end">MATH-500</text>
      <text x="-10" y="160" text-anchor="end">GPQA Diamond</text>
      <text x="-10" y="220" text-anchor="end">Codeforces</text>
    </g>

    <!-- X axis (months) -->
    <g font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="304">2024-09</text>
      <text x="200" y="304">2024-12</text>
      <text x="400" y="304">2025-03</text>
      <text x="600" y="304">2025-06</text>
      <text x="800" y="304">2025-09</text>
      <text x="980" y="304" text-anchor="end">2026-05</text>
    </g>

    <!-- AIME 2024 -->
    <g>
      <circle cx="0" cy="40" r="9" fill="#f472b6" stroke="#0b1220" stroke-width="2"/>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#fbcfe8">o1 (74.4%)</text>

      <line x1="0" y1="40" x2="270" y2="40" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 3"/>

      <circle cx="270" cy="40" r="9" fill="#34d399" stroke="#0b1220" stroke-width="2"/>
      <text x="284" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">R1 (79.8%)</text>
    </g>

    <!-- MATH-500 -->
    <g>
      <circle cx="0" cy="100" r="9" fill="#f472b6" stroke="#0b1220" stroke-width="2"/>
      <text x="14" y="104" font-family="'Inter', sans-serif" font-size="11" fill="#fbcfe8">o1 (94.8%)</text>

      <line x1="0" y1="100" x2="270" y2="100" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 3"/>

      <circle cx="270" cy="100" r="9" fill="#34d399" stroke="#0b1220" stroke-width="2"/>
      <text x="284" y="104" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">R1 (97.3%)</text>
    </g>

    <!-- GPQA Diamond -->
    <g>
      <circle cx="0" cy="160" r="9" fill="#f472b6" stroke="#0b1220" stroke-width="2"/>
      <text x="14" y="164" font-family="'Inter', sans-serif" font-size="11" fill="#fbcfe8">o1 (~78%)</text>

      <line x1="0" y1="160" x2="270" y2="160" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 3"/>

      <circle cx="270" cy="160" r="9" fill="#34d399" stroke="#0b1220" stroke-width="2"/>
      <text x="284" y="164" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">R1 (71.5%)</text>
    </g>

    <!-- Codeforces percentile -->
    <g>
      <circle cx="0" cy="220" r="9" fill="#f472b6" stroke="#0b1220" stroke-width="2"/>
      <text x="14" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#fbcfe8">o1 (~89th)</text>

      <line x1="0" y1="220" x2="270" y2="220" stroke="#f472b6" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 3"/>

      <circle cx="270" cy="220" r="9" fill="#34d399" stroke="#0b1220" stroke-width="2"/>
      <text x="284" y="224" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">R1 (96.3rd)</text>
    </g>

    <!-- Annotation: R1 release -->
    <g transform="translate(270, -20)">
      <line x1="0" y1="0" x2="0" y2="300" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
      <rect x="-50" y="-18" width="100" height="20" rx="3" fill="#0b1220" stroke="#7dd3fc"/>
      <text x="0" y="-4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#7dd3fc" font-weight="700">R1 RELEASE</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 510)" font-family="'Inter', sans-serif">
    <text x="0" y="0" font-size="11" letter-spacing="2" fill="#94a3b8" font-weight="600">LEGEND</text>
    <g transform="translate(80, -6)">
      <circle cx="6" cy="6" r="6" fill="#f472b6"/>
      <text x="20" y="10" font-size="12" fill="#cbd5e1">closed model (vendor-reported)</text>
      <circle cx="220" cy="6" r="6" fill="#34d399"/>
      <text x="234" y="10" font-size="12" fill="#cbd5e1">open weights (verifiable)</text>
      <line x1="430" y1="6" x2="470" y2="6" stroke="#f472b6" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="478" y="10" font-size="12" fill="#cbd5e1">gap closed in window</text>
    </g>
  </g>
</svg>
