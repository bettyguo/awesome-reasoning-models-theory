<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Five schools of thought on why reasoning models work">
  <defs>
    <linearGradient id="sotbg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="sotgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#sotbg)"/>
  <rect width="1200" height="760" fill="url(#sotgrid)"/>

  <!-- Title -->
  <g font-family="'Inter', system-ui, sans-serif">
    <text x="60" y="56" font-size="13" letter-spacing="4" font-weight="500" fill="#7dd3fc">FIVE SCHOOLS OF THOUGHT</text>
    <text x="60" y="100" font-size="32" font-weight="800" fill="#f8fafc">Why do reasoning models actually work?</text>
    <text x="60" y="128" font-size="14" fill="#94a3b8">Five mechanistic accounts in active circulation. Most are partly true; none alone explains everything.</text>
  </g>

  <!--
    Layout, all in absolute coordinates.
    Center hub: (600, 440), radius 80.
    Box dimensions: 280 wide, 92 tall (so the corner (cx-140, cy-46) to (cx+140, cy+46)).
    5 box centers chosen on a regular pentagon-ish layout around the hub:
      Top    : (600, 220)
      Right  : (1020, 360)
      BotR   : (880, 600)
      BotL   : (320, 600)
      Left   : (180, 360)
    Lines from box edge to hub edge.
  -->

  <!-- Connecting lines (drawn FIRST, behind boxes) -->
  <!-- Top box (600, 220) bottom edge → hub top (600, 360) -->
  <line x1="600" y1="266" x2="600" y2="360" stroke="#7dd3fc" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Right box (1020, 360) left edge (880, 360) → hub right (680, 440-ish) -->
  <line x1="880" y1="360" x2="676" y2="408" stroke="#c4b5fd" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Bottom-right box (880, 600) top-left edge (740, 554) → hub bottom-right (656, 496) -->
  <line x1="740" y1="554" x2="656" y2="496" stroke="#fdba74" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Bottom-left box (320, 600) top-right edge (460, 554) → hub bottom-left (544, 496) -->
  <line x1="460" y1="554" x2="544" y2="496" stroke="#6ee7b7" stroke-width="1.6" stroke-opacity="0.55"/>
  <!-- Left box (180, 360) right edge (320, 360) → hub left (524, 408) -->
  <line x1="320" y1="360" x2="524" y2="408" stroke="#fbcfe8" stroke-width="1.6" stroke-opacity="0.55"/>

  <!-- Hub circle (drawn after lines so it overlays them) -->
  <circle cx="600" cy="440" r="200" fill="url(#hub)"/>
  <circle cx="600" cy="440" r="80" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="430" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" letter-spacing="3" fill="#7dd3fc" font-weight="600">THE QUESTION</text>
  <text x="600" y="456" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" fill="#f8fafc" font-weight="700">Why CoT helps?</text>

  <!-- 5 nodes (boxes 280×92, centered on the listed coords) -->

  <!-- TOP: Compute-depth (cx=600, cy=220) -->
  <g>
    <rect x="460" y="174" width="280" height="92" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="600" y="200" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#7dd3fc">SCHOOL 1 · FORMAL</text>
    <text x="600" y="226" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Compute-depth extension</text>
    <text x="600" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">CoT escapes TC₀ → T extra serial steps</text>
  </g>

  <!-- RIGHT: Implicit search (cx=1020, cy=360) -->
  <g>
    <rect x="880" y="314" width="280" height="92" rx="10" fill="#0b1220" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="1020" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#c4b5fd">SCHOOL 2 · OPERATIONAL</text>
    <text x="1020" y="366" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Implicit / amortized search</text>
    <text x="1020" y="390" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Greedy decoding mimics search</text>
  </g>

  <!-- BOTTOM-RIGHT: Program synthesis (cx=880, cy=600) -->
  <g>
    <rect x="740" y="554" width="280" height="92" rx="10" fill="#0b1220" stroke="#fb923c" stroke-width="1.6"/>
    <text x="880" y="580" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#fdba74">SCHOOL 3 · SYMBOLIC</text>
    <text x="880" y="606" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Program synthesis</text>
    <text x="880" y="630" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">CoT = source code of small programs</text>
  </g>

  <!-- BOTTOM-LEFT: Bayes-over-thoughts (cx=320, cy=600) -->
  <g>
    <rect x="180" y="554" width="280" height="92" rx="10" fill="#0b1220" stroke="#34d399" stroke-width="1.6"/>
    <text x="320" y="580" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#6ee7b7">SCHOOL 4 · STATISTICAL</text>
    <text x="320" y="606" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Bayes-over-thoughts</text>
    <text x="320" y="630" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">CoT = posterior over solution programs</text>
  </g>

  <!-- LEFT: RL-shaped policy (cx=180, cy=360) -->
  <g>
    <rect x="40" y="314" width="280" height="92" rx="10" fill="#0b1220" stroke="#f472b6" stroke-width="1.6"/>
    <text x="180" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" letter-spacing="2" font-weight="700" fill="#fbcfe8">SCHOOL 5 · PRACTITIONER</text>
    <text x="180" y="366" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">RL-shaped policy elicitation</text>
    <text x="180" y="390" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">RL elicits circuits already in the base</text>
  </g>

  <!-- Hint -->
  <text x="600" y="724" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">
    Each school explains a different fragment. The synthesis essay argues which dominates for which task.
  </text>
</svg>
